name: Build Debian package

on:
  push:
    branches: [main]
    paths-ignore:
      - 'packages/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debian-package-main
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python and test dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Syntax and unit tests
        run: |
          python -m compileall -q proxmox_duo tests
          python -m unittest discover -s tests -v
      - name: Build Debian package
        run: bash scripts/build-deb.sh packages
      - name: Validate Debian package
        run: |
          set -euo pipefail
          deb=(packages/*.deb)
          test "${#deb[@]}" -eq 1
          test "$(dpkg-deb -f "${deb[0]}" Package)" = "proxmox-duo-diagnostic"
          test "$(dpkg-deb -f "${deb[0]}" Architecture)" = "all"
          dpkg-deb -c "${deb[0]}" | tee /tmp/package-contents.txt
          grep -q 'usr/bin/proxmox-duo' /tmp/package-contents.txt
          grep -q 'usr/lib/python3/dist-packages/proxmox_duo/push.py' /tmp/package-contents.txt
          (cd packages && sha256sum -c -- *.sha256)
      - name: Commit built package to repository
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/*.deb packages/*.sha256
          if git diff --cached --quiet; then
            echo "No package changes to commit"
          else
            git commit -m "Build diagnostic Debian package"
            git push origin HEAD:main
          fi
